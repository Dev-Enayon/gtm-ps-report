services:
  # ─────────────────────────────────────────
  # Backend API (Node.js / Express)
  # ─────────────────────────────────────────
  - type: web
    name: gtm-ps-report
    runtime: node
    region: oregon
    plan: free          # upgrade to starter ($7/mo) for production
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false               # paste your Neon connection string here
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secure value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # ── Set these manually in Render dashboard ──
      - key: HEAD_ADMIN_EMAIL
        sync: false               # enter in Render dashboard
      - key: HEAD_ADMIN_PASSWORD
        sync: false
      - key: HEAD_ADMIN_FULLNAME
        sync: false
      - key: FRONTEND_URL
        sync: false               # your Vercel/Netlify URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

