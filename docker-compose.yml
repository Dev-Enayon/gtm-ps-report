version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: gotm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gotm_church_db
      POSTGRES_USER: gotm_admin
      POSTGRES_PASSWORD: localpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotm_admin -d gotm_church_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gotm_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://gotm_admin:localpassword123@postgres:5432/gotm_church_db
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      HEAD_ADMIN_EMAIL: headadmin@gotm.org
      HEAD_ADMIN_PASSWORD: Admin@2024!
      HEAD_ADMIN_FULLNAME: Head Administrator
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ── Frontend ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gotm_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
